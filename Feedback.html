<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - Rakatani Street Barbecue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <img src="logo.png" alt="Rakatani St. BBQ Logo" class="site-logo">
    <h1>RAKATANI STREET BARBECUE</h1>
    <p>Port Moresby's Smokiest Charcoal Grill &amp; Tender Meat Combo Packs</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu &amp; Orders</a>
    <a href="gallery.html">Gallery</a>
    <a href="feedback.html" class="active">Feedback</a>
    <a href="contact.html">Contact Us</a>
  </nav>

  <main>
    <section class="hero-card">
      <h2>Customer Feedback</h2>
      <p>We value your thoughts! Tell us about your recent dining or delivery experience.</p>
    </section>

    <section class="content-card">
      <form class="feedback-form" action="#" method="post">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="message">Your Feedback:</label>
        <textarea id="message" name="message" rows="5" placeholder="How was your meal?" required></textarea>

        <button type="submit" class="btn">Submit Feedback</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Rakatani Street Barbecue | PNG@SME Program</p>
  </footer>

</body>
</html>
